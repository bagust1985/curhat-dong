name: Images

# Build and publish to GHCR — E17-T03.
#
# Tagged with the commit SHA, always. `latest` is published too, but only as a
# convenience for humans reading the registry: the deploy pipeline resolves a
# SHA and never asks for `latest` (TECH-SPEC §9.2). Two servers pulling
# `latest` an hour apart run different code while reporting the same version.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infrastructure/docker/api.Dockerfile
            app: api
          - image: web
            dockerfile: infrastructure/docker/next.Dockerfile
            app: web
          - image: admin
            dockerfile: infrastructure/docker/next.Dockerfile
            app: admin

    steps:
      - uses: actions/checkout@v4

      # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so an
      # unset repository variable is not a missing convenience — it is a web
      # image whose every API call resolves against the web host and 404s.
      # Worse, it fails *quietly*: the deploy health gate only asks the API,
      # which is fine, so the gate goes green and nothing rolls back. Refusing
      # here means the image is never published and Deploy (which requires
      # this workflow to succeed) never fires.
      - name: Refuse to build a browser bundle with no public URLs
        if: matrix.app != 'api'
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_URL API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable NEXT_PUBLIC_${name} belum diisi — lihat Settings → Secrets and variables → Actions → Variables"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # A secret baked into a layer stays in the registry forever, even after a
      # later layer deletes the file. Cheaper to check every build than to
      # rotate every credential once.
      - name: Fail if a secret got baked in
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}"
          docker create --name probe "$image" >/dev/null
          docker export probe | tar -t 2>/dev/null > /tmp/files.txt || true
          docker rm probe >/dev/null

          if grep -Eq '(^|/)\.env(\.|$)|(^|/)id_rsa$|\.pem$' /tmp/files.txt; then
            echo "::error::image berisi file kredensial"
            grep -E '(^|/)\.env(\.|$)|(^|/)id_rsa$|\.pem$' /tmp/files.txt | head
            exit 1
          fi
          echo "tidak ada file kredensial di dalam image"
