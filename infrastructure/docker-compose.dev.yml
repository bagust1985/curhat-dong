name: curhat-dong-dev

# Local development infrastructure only (E01-T08).
# Production compose lands in E17-T02 and adds caddy, api, worker, web, admin.
#
# PORTS: this VPS is shared with other projects. Host ports are deliberately
# outside the default range — 5432 and 6379 are NOT used. See PORTS.md.
# Run `pnpm infra:check` before `up` to catch a conflict early.

services:
  postgres:
    image: postgres:16-alpine
    container_name: curhat-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: curhat
      POSTGRES_PASSWORD: curhat
      POSTGRES_DB: curhat_dong
      # Indonesian text search needs a predictable collation.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Bound to loopback: never reachable from the network, even in dev
      # (TECH-SPEC §7.1). Host port 54329, container port stays 5432.
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curhat -d curhat_dong']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: curhat-redis-dev
    restart: unless-stopped
    # appendonly keeps BullMQ jobs across a restart. Redis is still not a
    # source of truth (CLAUDE.md non-negotiable #5) — this just avoids losing
    # queued work on every `docker compose restart` during development.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Host port 63799, NOT 6379 — the system Redis already owns 6379 and
      # belongs to another project. See PORTS.md for why we do not share it.
      - '127.0.0.1:63799:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
