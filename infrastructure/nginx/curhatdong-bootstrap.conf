# Bootstrap sementara — E17-T01.
#
# Dipasang **sebelum** sertifikat ada, dan dicabut setelahnya.
#
# ## Kenapa perlu file terpisah
#
# `curhatdong.conf` menunjuk `/etc/letsencrypt/live/curhatdong.com/…` yang belum
# ada. Memasangnya duluan bikin `nginx -t` gagal — dan di VPS ini nginx melayani
# empat proyek lain. Config rusak berarti **tidak ada yang bisa reload nginx**,
# dan siapa pun yang kebetulan me-restart nginx menjatuhkan kelima situs
# sekaligus.
#
# Jadi urutannya: bootstrap (HTTP saja) → terbitkan sertifikat → pasang config
# penuh → reload.

server {
	listen 80;
	listen [::]:80;
	server_name curhatdong.com www.curhatdong.com api.curhatdong.com admin.curhatdong.com;

	# Satu-satunya tugas file ini.
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	# Belum ada apa pun untuk dilayani. 503 lebih jujur daripada halaman default
	# nginx yang bikin orang mengira situsnya sudah hidup.
	location / {
		return 503 'CURHAT DONG belum tayang.';
		add_header Content-Type text/plain;
	}
}
