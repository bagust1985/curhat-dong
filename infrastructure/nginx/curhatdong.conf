# nginx server blocks — E17-T01 (revisi untuk VPS bersama).
#
# ## Kenapa nginx, bukan Caddy
#
# VPS ini menjalankan empat proyek lain (/var/www/) dan **nginx sudah memegang
# port 80 dan 443**. Di mesin bersama, edge proxy adalah sumber daya tunggal:
# dua proxy berebut 443 tidak punya solusi bagus, yang ada cuma siapa yang
# menang. Caddy dihapus dari compose supaya menyalakan stack ini tidak pernah
# bisa mematikan empat proyek tetangga.
#
# Container CURHAT DONG bind ke 127.0.0.1 saja (lihat PORTS.md):
#   web 3110 · api 3111 · admin 3112
#
# Pasang: /etc/nginx/sites-available/curhatdong.conf → symlink ke sites-enabled,
# lalu `nginx -t && systemctl reload nginx`. **Jangan restart** — reload tidak
# memutus koneksi proyek lain.

# Cloudflare mem-proxy keempat host (awan oranye), jadi IP asli datang di
# CF-Connecting-IP. Tanpa blok ini setiap pengunjung terlihat sebagai IP
# Cloudflare, dan rate limit kita jadi berlaku ke semua orang sekaligus.
# Daftar ini perlu diperbarui kalau Cloudflare menambah range:
#   curl https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# --- Web ---------------------------------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name curhatdong.com www.curhatdong.com;

	ssl_certificate     /etc/letsencrypt/live/curhatdong.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/curhatdong.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.curhatdong.com wss://api.curhatdong.com; frame-src https://challenges.cloudflare.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

	location / {
		proxy_pass http://127.0.0.1:3110;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
	}
}

# --- API ---------------------------------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name api.curhatdong.com;

	ssl_certificate     /etc/letsencrypt/live/curhatdong.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/curhatdong.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
	add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

	# Isi curhat lewat sini. Body besar diizinkan, tapi tidak tak terbatas.
	client_max_body_size 2m;

	location / {
		proxy_pass http://127.0.0.1:3111;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

		# Websocket /rt (TECH-SPEC §3.5).
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# SSE DONG AI: buffering mati, timeout panjang. Dengan buffering menyala
		# balasan streaming baru sampai setelah selesai — persis kebalikan dari
		# streaming.
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 300s;
	}
}

# --- Admin -------------------------------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name admin.curhatdong.com;

	ssl_certificate     /etc/letsencrypt/live/curhatdong.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/curhatdong.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
	add_header Cache-Control "no-store" always;
	add_header X-Frame-Options "DENY" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.curhatdong.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

	location / {
		proxy_pass http://127.0.0.1:3112;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
	}
}

# --- HTTP → HTTPS ------------------------------------------------------------
server {
	listen 80;
	listen [::]:80;
	server_name curhatdong.com www.curhatdong.com api.curhatdong.com admin.curhatdong.com;

	# certbot menaruh challenge di sini; jangan di-redirect.
	location /.well-known/acme-challenge/ { root /var/www/html; }
	location / { return 301 https://$host$request_uri; }
}
